name: release (example — copy into an app repo)
# Brand-neutral 5-platform release. Replace OWNER with your org (where you forked ci-signing).
# Pattern: each BUILD job uploads an artifact; each SIGN job (reusable, sign-only) downloads it,
# signs, and re-uploads `<name>-signed`. Config via vars.*, credentials via secrets.*.
on:
  push:
    tags: ['v*']

jobs:
  # ---------------- build (your repo's build logic) ----------------
  build-macos:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh macos                         # -> App.app
      - uses: actions/upload-artifact@v4
        with: { name: macos-app, path: App.app }

  build-windows:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
      - run: ./build.ps1                              # -> dist\App.exe / .msi
      - uses: actions/upload-artifact@v4
        with: { name: windows-build, path: dist }

  build-linux:
    runs-on: ${{ vars.LINUX_RUNNER }}                 # e.g. "myorg-amd64" (ARC scale-set)
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh linux                         # -> dist/*.AppImage, *.deb, *.tar.gz
      - uses: actions/upload-artifact@v4
        with: { name: linux-build, path: dist }

  build-ios:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -workspace App.xcworkspace -scheme App -archivePath App.xcarchive -destination 'generic/platform=iOS' archive
      - uses: actions/upload-artifact@v4
        with: { name: ios-archive, path: App.xcarchive }

  build-android:
    runs-on: ${{ vars.LINUX_RUNNER }}
    steps:
      - uses: actions/checkout@v4
      - run: ./gradlew bundleRelease -x validateSigning  # UNSIGNED .aab
      - uses: actions/upload-artifact@v4
        with: { name: android-aab, path: '**/build/outputs/bundle/release/*.aab' }

  # ---------------- sign (reusable, sign-only) ----------------
  sign-macos:
    needs: build-macos
    uses: hanzoai/ci-signing/.github/workflows/sign-macos.yml@v1
    with: { artifact-name: macos-app, app-name: App.app, make-dmg: true }
    secrets:
      CERT_P12_BASE64:       ${{ secrets.MACOS_CERT_P12_BASE64 }}
      CERT_PASSWORD:         ${{ secrets.MACOS_CERT_PASSWORD }}
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      ASC_API_KEY_ID:        ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID:     ${{ secrets.ASC_API_ISSUER_ID }}
      TEAM_ID:               ${{ secrets.APPLE_TEAM_ID }}

  sign-windows:
    needs: build-windows
    uses: hanzoai/ci-signing/.github/workflows/sign-windows.yml@v1
    with:
      artifact-name: windows-build
      account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      cert-profile: ${{ vars.AZURE_CERT_PROFILE }}
    secrets:
      AZURE_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  sign-linux:
    needs: build-linux
    uses: hanzoai/ci-signing/.github/workflows/sign-linux.yml@v1
    with: { artifact-name: linux-build, artifacts-glob: "*.AppImage *.deb *.tar.gz" }
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE:  ${{ secrets.LINUX_GPG_PASSPHRASE }}

  sign-ios:
    needs: build-ios
    uses: hanzoai/ci-signing/.github/workflows/sign-ios.yml@v1
    with: { archive-artifact-name: ios-archive, archive-name: App.xcarchive, export-method: app-store, upload-testflight: true }
    secrets:
      DIST_CERT_P12_BASE64:        ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
      DIST_CERT_PASSWORD:          ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      ASC_API_KEY_P8_BASE64:       ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      ASC_API_KEY_ID:              ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID:           ${{ secrets.ASC_API_ISSUER_ID }}
      TEAM_ID:                     ${{ secrets.APPLE_TEAM_ID }}

  sign-android:
    needs: build-android
    uses: hanzoai/ci-signing/.github/workflows/sign-android.yml@v1
    with:
      artifact-name: android-aab
      file-glob: "*.aab"
      upload-play: false
      package-name: ${{ vars.ANDROID_PACKAGE }}
    secrets:
      KEYSTORE_BASE64:           ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD:         ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS:                 ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD:              ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
