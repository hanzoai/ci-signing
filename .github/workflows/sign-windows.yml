name: sign-windows
# Reusable, SIGN-ONLY: Authenticode-sign prebuilt Windows artifacts (from your build job's artifact).
# DEFAULT = Azure Trusted Signing (cheapest, key in MS HSM, OIDC). jsign/YubiKey variant inline below.
on:
  workflow_call:
    inputs:
      artifact-name: { type: string, required: true }                 # build job's uploaded artifact
      account-name:  { type: string, required: true }
      cert-profile:  { type: string, required: true }
      endpoint:      { type: string, default: 'https://wus2.codesigning.azure.net/' }
      filter:        { type: string, default: 'exe,msi,dll,appx,msix,ps1' }
      runs-on:       { type: string, default: '["self-hosted","Windows","X64"]' }
    secrets:
      AZURE_CLIENT_ID:       { required: true }
      AZURE_TENANT_ID:       { required: true }
      AZURE_SUBSCRIPTION_ID: { required: true }

permissions:
  id-token: write     # OIDC — no stored secret
  contents: read

jobs:
  sign:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: dist

      - uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/trusted-signing-action@v0   # pin a tag (e.g. @v0.5.9) in prod
        with:
          endpoint:                     ${{ inputs.endpoint }}
          trusted-signing-account-name: ${{ inputs.account-name }}
          certificate-profile-name:     ${{ inputs.cert-profile }}
          files-folder:                 dist
          files-folder-filter:          ${{ inputs.filter }}
          file-digest:                  SHA256
          timestamp-rfc3161:            http://timestamp.acs.microsoft.com
          timestamp-digest:             SHA256

      - name: Verify
        shell: pwsh
        run: Get-ChildItem dist -Include *.exe,*.msi,*.dll -Recurse | ForEach-Object { signtool verify /pa /v $_.FullName }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}-signed
          path: dist

# ALTERNATIVE — key-at-home (YubiKey 5 FIPS) or Cloud KMS via jsign (runs on Linux too).
# Needs an OV cert from SSL.com/Sectigo issued onto the token/KMS. Replace the azure steps with:
#   - run: jsign --storetype YUBIKEY --certfile org.crt --tsaurl http://timestamp.sectigo.com --alg SHA-256 dist/*.exe
#     (Cloud KMS: --storetype GOOGLECLOUD | AWS | AZUREKEYVAULT  + --storepass <token>)
